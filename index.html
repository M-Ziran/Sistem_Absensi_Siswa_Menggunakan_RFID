<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Absensi</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-logo">
        <div class="logo-icon">🎓</div>
        <h1>SiAbsen</h1>
        <p>Sistem Absensi Siswa Berbasis NFC</p>
      </div>

      <div class="login-card">
        <div class="login-tabs">
          <button class="login-tab active" id="tabAdmin" onclick="switchTab('admin')">👑 Admin</button>
          <button class="login-tab" id="tabGuru" onclick="switchTab('guru')">📚 Guru</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" class="form-input" placeholder="email@sekolah.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="passInput" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
            Masuk
          </button>
        </form>

        <p style="text-align:center; margin-top:16px; font-size:12px; color:var(--grey-2);">
          Untuk reset password, hubungi Administrator.
        </p>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    let currentRole = 'admin';

    function switchTab(role) {
      currentRole = role;
      document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
      document.getElementById('tabGuru').classList.toggle('active', role === 'guru');
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      const btn      = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Memverifikasi...';

      try {
        // Sign in with Firebase Auth
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const uid  = cred.user.uid;

        // Read user profile from Realtime Database
        const snap = await db.ref(`users/${uid}`).get();

        if (!snap.exists()) {
          await auth.signOut();
          showError('Akun tidak ditemukan di sistem.');
          return;
        }

        const userData = snap.val();

        // Role check
        if (userData.role !== currentRole) {
          await auth.signOut();
          showError(`Akun ini bukan akun ${currentRole === 'admin' ? 'Admin' : 'Guru'}. Pilih tab yang sesuai.`);
          return;
        }

        if (userData.status === 'nonaktif') {
          await auth.signOut();
          showError('Akun Anda telah dinonaktifkan. Hubungi Admin.');
          return;
        }

        // Save session
        sessionStorage.setItem('currentUser', JSON.stringify({
          uid:   uid,
          email: email,
          name:  userData.name,
          role:  userData.role
        }));

        // Redirect based on role
        window.location.href = currentRole === 'admin'
          ? 'pages/dashboard.html'
          : 'pages/dashboard-guru.html';

      } catch (err) {
        let msg = 'Login gagal. Periksa email dan password.';
        if (err.code === 'auth/user-not-found')    msg = 'Email tidak terdaftar.';
        if (err.code === 'auth/wrong-password')    msg = 'Password salah.';
        if (err.code === 'auth/invalid-email')     msg = 'Format email tidak valid.';
        if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
        showError(msg);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Masuk';
      }
    }

    // If already logged in, redirect
    auth.onAuthStateChanged(user => {
      if (user) {
        const saved = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
        if (saved) {
          window.location.href = saved.role === 'admin'
            ? 'pages/dashboard.html'
            : 'pages/dashboard-guru.html';
        }
      }
    });
  </script>
</body>
</html>
